[project]
name = "live-studio-backend"
version = "0.1.0"
description = "LIVE / Studio: AI co-pilot backend for live-commerce broadcasts"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.133,<0.142",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "google-genai>=2.26",
    "httpx>=0.28",
    "rank-bm25>=0.2.2",
    "pypdf>=5.0",
    "google-cloud-speech>=2.37",
    "google-adk>=2.11,<2.12",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
